# Base Helm values for a self-contained local Airbyte (chart airbyte/airbyte 2.x).
#
# Design goals:
#   * Everything internal -- no external Postgres, no cloud object storage.
#   * Nothing here is kind-specific, so the same file can be reused when this
#     moves to a real cluster. Only the ingress host and the cluster/VM bits
#     live outside this file.
#
# Release-name-dependent values (global.airbyteUrl, WEBAPP_URL) are injected by
# scripts/install.sh via --set, because Helm values files cannot interpolate.

global:
  edition: community

  # Bundled Postgres, templated by the chart itself as StatefulSet "airbyte-db".
  # "internal" is the chart default; pinned explicitly so an upstream default
  # flip can never silently point this at an external database.
  database:
    type: internal

  # Bundled MinIO for logs / state / workload output. This keeps the install
  # self-contained; swap to s3/gcs when migrating to a cloud cluster.
  storage:
    type: minio

  # Secrets (connector credentials) live in the config database because no
  # external secrets manager is configured. This is what makes a pg_dumpall
  # backup a complete backup of your connections.
  secretsManager:
    enabled: false

  auth:
    enabled: true

  jobs:
    # Ceiling for connector job pods. Matches abctl's default (it sets these
    # regardless of --low-resource-mode).
    resources:
      limits:
        cpu: "3"
        memory: 4Gi

    errors:
      # Report connector job errors to the local log instead of Sentry.
      # This is already the chart default; pinned so an upstream change to that
      # default cannot start shipping stack traces off the machine.
      reportingStrategy: logging

  # ---------------------------------------------------------------------------
  # Telemetry: fully disabled
  # ---------------------------------------------------------------------------
  # Out of the box this chart DOES phone home. It ships a hardcoded Airbyte
  # Segment write key as the default for tracking.segment.writeKeySecretKey and
  # defaults tracking.enabled to true with strategy "segment", so a stock
  # install posts usage events to Airbyte's Segment project.
  #
  # Note that the "Anonymize usage data collection" checkbox on the signup
  # screen does NOT turn this off. That checkbox writes
  # workspace.anonymous_data_collection, which only controls whether events are
  # tagged with your workspace ID or a random UUID -- the events are still sent.
  # `strategy: logging` is the actual off switch: events are written to the pod
  # log instead of being transmitted anywhere.
  tracking:
    enabled: false
    strategy: logging   # one of: logging, segment
    segment:
      # Replaces the chart's built-in Airbyte write key. Cannot be set to ""
      # here -- the template resolves it with sprig's `default`, which treats an
      # empty string as unset and would restore the real key. A dummy value
      # means that even if tracking were somehow re-enabled, there is no valid
      # destination to post to.
      writeKeySecretKey: "disabled"

  # APM. Already off by default; pinned so it stays off.
  datadog:
    enabled: false
    debug: false

  # Metrics egress. All exporters off and endpoints empty, so nothing leaves the
  # cluster. `publish` is undocumented in the chart's values.yaml but defaults
  # to true, so it is set explicitly here.
  metrics:
    enabled: false
    publish: false
    otlp:
      enabled: false
    statsd:
      enabled: false

# Bundled Postgres. Chart default PVC is 500Mi, which fills up quickly once
# job history accumulates.
postgresql:
  enabled: true
  storage:
    volumeClaimValue: 10Gi

minio:
  enabled: true
  # The chart pins minio/minio on Docker Hub, but MinIO removed its old tags
  # there (pulls fail with "pull access denied"). The same tag still exists
  # on quay.io.
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2023-11-20T22-40-07Z
  storage:
    volumeClaimValue: 10Gi

# Route http://localhost:<HOST_PORT>/ to airbyte-server. The chart's ingress
# template only supports backend "server" -- in chart 2.x the server also
# serves the web UI (webapp.enabled is false by default).
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
          backend: server

airbyteBootloader:
  env_vars:
    PLATFORM_LOG_FORMAT: json
